name: home-server

networks:
  immich:
    driver: bridge

services:
  # ==========================================
  # GESTIONE E DASHBOARD
  # ==========================================

  # Portainer CE - Gestione Container Avanzata
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${CONFIG_PATH}/portainer:/data
    ports:
      - 9000:9000
    restart: unless-stopped

  # Homepage - Dashboard moderna (Alternative a CasaOS)
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    volumes:
      - ${CONFIG_PATH}/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - 3000:3000
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    user: "${PUID}:${PGID}"
    group_add:
      - "988"
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      HOMEPAGE_ALLOWED_HOSTS: "*"
    networks:
      - default
      - immich
    restart: unless-stopped

  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    profiles: ["media"]
    user: "${PUID}:${PGID}" # Esegue con i tuoi permessi per evitare problemi di scrittura
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ${CONFIG_PATH}/filebrowser/filebrowser.db:/database.db
      - ${CONFIG_PATH}/filebrowser/settings.json:/img/.filebrowser.json
      # Mappiamo cosa vuoi vedere nel File Manager:
      - ${MEDIA_PATH}:/srv/HDD_12TB # Vedrai il disco esterno come cartella "HDD_12TB"
      - ${CONFIG_PATH}:/srv/Docker_Configs # Vedrai le config dei container (utile per backup)
    ports:
      - 8050:80 # Usiamo la porta 8050 (la 8080 è occupata da qBit)
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=Europe/Rome
      - DOCKER_API_VERSION=1.53
    command: --cleanup --schedule "0 0 4 * * *"
    healthcheck:
      test: ["CMD", "/watchtower", "--health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ==========================================
  # DOWNLOAD CLIENT
  # ==========================================

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    profiles: ["media"]
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - ${CONFIG_PATH}/qbittorrent:/config
      # Rimuove lockfile/ipc-socket stale prima di ogni avvio (evita crash dopo stop forzato)
      - ${CONFIG_PATH}/qbittorrent/custom-cont-init.d:/custom-cont-init.d:ro
      # Mappatura CRUCIALE: Deve essere identica a Radarr/Sonarr per gli Hardlink
      - ${MEDIA_PATH}:/data
    ports:
      - 8080:8080 # WebUI
      - 6881:6881 # Traffico Torrent TCP
      - 6881:6881/udp # Traffico Torrent UDP
    deploy:
      resources:
        limits:
          cpus: '2' # Alzato da 0.5 a 2 core: il limite precedente causava thrashing (CPU e RAM sempre al tetto)
          memory: 6G # Alzato da 4G a 6G, stesso motivo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ==========================================
  # MEDIA SERVER (Con Transcodifica HW N150)
  # ==========================================

  # Plex - Il Re dei media server
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    profiles: ["media"]
    network_mode: host
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - VERSION=docker
      - PLEX_CLAIM=${PLEX_CLAIM}
    volumes:
      - ${CONFIG_PATH}/plex:/config
      - ${MEDIA_PATH}/Media:/media # Punta al HDD esterno
    devices:
      - /dev/dri:/dev/dri # <--- ABILITA GPU INTEL N150
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:32400/identity"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Jellyfin - L'alternativa Open Source
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    profiles: ["media"]
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ${CONFIG_PATH}/jellyfin:/config
      - ${MEDIA_PATH}/Media:/media
    ports:
      - 8096:8096
    devices:
      - /dev/dri:/dev/dri # <--- ABILITA GPU INTEL N150
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # ==========================================
  # AUTOMAZIONE DOWNLOAD (*ARR)
  # ==========================================

  radarr:
    # Versione fissata (non piu' ":latest"): Watchtower NON deve aggiornarla in automatico,
    # per non rompere in silenzio le impostazioni (es. i Custom Format per la lingua italiana)
    image: lscr.io/linuxserver/radarr:6.3.0.10514-ls312
    container_name: radarr
    profiles: ["media"]
    labels:
      - com.centurylinklabs.watchtower.enable=false
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ${CONFIG_PATH}/radarr:/config
      - ${MEDIA_PATH}:/data # Mappatura unica per Hardlinks (importante!)
    ports:
      - 7878:7878
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7878/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  sonarr:
    # Versione fissata (non piu' ":latest"): Watchtower NON deve aggiornarla in automatico,
    # per non rompere in silenzio le impostazioni (es. i Custom Format per la lingua italiana)
    image: lscr.io/linuxserver/sonarr:4.0.19.2979-ls320
    container_name: sonarr
    profiles: ["media"]
    labels:
      - com.centurylinklabs.watchtower.enable=false
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ${CONFIG_PATH}/sonarr:/config
      - ${MEDIA_PATH}:/data # Mappatura unica per Hardlinks
    ports:
      - 8989:8989
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    profiles: ["media"]
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_PATH}/prowlarr:/config
    ports:
      - 9696:9696
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9696/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    profiles: ["media"]
    environment:
      - TZ=${TZ}
      - LOG_LEVEL=info
    ports:
      - 8191:8191
    restart: unless-stopped

  # ==========================================
  # RETE E ACCESSO
  # ==========================================

  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: home-server
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTH_KEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_EXTRA_ARGS=--advertise-routes=192.168.3.0/24 --advertise-exit-node
    volumes:
      - ${CONFIG_PATH}/tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    healthcheck:
      test: ["CMD", "tailscale", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      default:

        # ==========================================
        # MONITORING
        # ==========================================

        # Beszel - Monitoring leggerissimo (Hub + Agent)
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    network_mode: host
    # ports:
    #   - 8090:8090
    volumes:
      - ${CONFIG_PATH}/beszel:/beszel_data
    healthcheck:
      test: ["CMD", "/beszel", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    network_mode: host
    environment:
      PORT: 45876
      KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGG6kHPlH62RkJ+cVVSvrwTM1JEmB2FfvLazJoZjbsKb" # La inserirai dopo il primo avvio
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "/agent", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ==========================================
  # TOOLS UTILI
  # ==========================================

  stirling-pdf:
    image: frooodle/s-pdf:latest
    container_name: stirling-pdf
    ports:
      - 8081:8080
    environment:
      - DOCKER_ENABLE_SECURITY=false
    restart: unless-stopped

  it-tools:
    image: corentinth/it-tools:latest
    container_name: it-tools
    ports:
      - 8082:80
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ==========================================
  # IMMICH (FOTO CLOUD - Configurazione Unificata & HW Accel)
  # ==========================================

  immich-server:
    container_name: immich_server
    profiles: ["media"]
    image: ghcr.io/immich-app/immich-server:release
    # Per Intel N100/N150 (QuickSync Transcoding)
    devices:
      - /dev/dri:/dev/dri
    volumes:
      # Percorso foto/video (Assicurati che questo path esista e abbia i permessi)
      - ${MEDIA_PATH}/Immich:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    environment:
      - DB_HOSTNAME=immich_postgres
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE_NAME=${DB_DATABASE_NAME}
      - REDIS_HOSTNAME=immich_redis
    ports:
      # Mappa la porta definita nel .env (es. 2284) alla porta interna 2283
      - ${IMMICH_PORT:-2284}:2283
    depends_on:
      - immich_redis
      - immich_postgres
    restart: always
    networks:
      - immich

  immich_machine_learning:
    container_name: immich_machine_learning
    # Usiamo la versione OpenVINO specifica per CPU Intel (più veloce su N100)
    image: ghcr.io/immich-app/immich-machine-learning:release-openvino
    device_cgroup_rules:
      - "c 189:* rmw" # Permessi opzionali per alcuni acceleratori, male non fa
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ${CONFIG_PATH}/immich_model-cache:/cache
    env_file:
      - .env
    restart: always
    networks:
      - immich

  immich_redis:
    container_name: immich_redis
    image: redis:6.2-alpine
    restart: always
    networks:
      - immich

  immich_postgres:
    container_name: immich_postgres
    # Immagine ufficiale Immich con estensione VectorChord (pgvecto-rs è deprecato e incompatibile con Immich v3+)
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - ${CONFIG_PATH}/immich_postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d ${DB_DATABASE_NAME} -U ${DB_USERNAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always
    networks:
      - immich

  # ==========================================
  # GAME SERVERS (Stoppati di default)
  # ==========================================

  minecraft:
    image: itzg/minecraft-server
    container_name: minecraft
    profiles: [ "games" ] # <--- MAGIA: Non parte con "docker compose up"
    ports:
      - 25565:25565
    environment:
      EULA: "TRUE"
      MEMORY: "4G" # Assegna 4GB di RAM
    volumes:
      - ${CONFIG_PATH}/minecraft:/data
    restart: no
