cozy_light_camera_da_letto:
  alias: "Cozy Light"
  icon: mdi:weather-night
  sequence:
    - action: switch.turn_off
      target:
        entity_id: switch.camera_letto_sonoff_100104a286
    - action: light.turn_on
      target:
        entity_id:
          - light.yeelink_de_313037363_color2_s_2_light
          - light.yeelink_de_113252899_lamp1_s_2_light
      data:
        brightness_pct: 30
        color_temp_kelvin: 2700
    - action: light.turn_on
      target:
        entity_id: light.controller_rgb_5c45b5
      data:
        brightness_pct: 30
        rgb_color: [255, 147, 41]

